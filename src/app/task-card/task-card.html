<div class="task-card">
    <div
        class="task-card__title"
        [title]="task().title"
    >
        {{ task().title }}
    </div>
    <div
        class="task-card__description"
        [title]="task().description"
    >
        {{ task().description || '-'}}
    </div>
    <div class="task-card__details-list">
        <div class="task-card__detail">
            <div class="task-card__label">Due Date:</div>
            <div class="task-card__value">{{ task().dueDate | date: 'MMM d, y' }}</div>
        </div>
        <div class="task-card__detail">
            <div class="task-card__label">Priority:</div>
            <div class="task-card__value">{{ task().priority }}</div>
        </div>
    </div>
</div>
